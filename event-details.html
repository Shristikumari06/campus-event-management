<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details | CampusConnect</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body style="background: #070a14; color: #f1f5f9; min-height: 100vh;">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrapper">
          <i class="fa-solid fa-graduation-cap logo-icon"></i>
        </div>
        <div class="logo-text">
          <span class="logo-main">Campus<span class="logo-accent">Connect</span></span>
          <span class="logo-sub">University Event Hub</span>
        </div>
      </a>

      <nav class="nav-menu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house nav-icon"></i> Home</a></li>
          <li><a href="events.html" class="nav-link active"><i class="fa-solid fa-calendar-days nav-icon"></i> Events</a></li>
          <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-gauge-high nav-icon"></i> Dashboard</a></li>
          <li><a href="my-registrations.html" class="nav-link"><i class="fa-solid fa-ticket nav-icon"></i> My Passes</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <!-- Injected via main.js -->
      </div>
    </div>
  </header>

  <main style="padding-top: 130px; padding-bottom: 90px;">
    <div class="container" style="max-width: 900px;">
      
      <!-- Back Link -->
      <a href="events.html" class="btn btn-subtle mb-3" style="display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Events Catalog
      </a>

      <div id="event-detail-content">
        <div style="text-align: center; padding: 4rem;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: #ff0080; margin-bottom: 1rem;"></i>
          <p style="color: #94a3b8;">Loading event information...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Shared & Events JavaScript -->
  <script src="js/main.js"></script>
  <script src="js/pdf-generator.js"></script>
  <script>
    const DEFAULT_CAMPUS_EVENTS = [
      {
        id: 1,
        title: "TechFest 2026: Quantum Leap",
        category: "College Fest",
        description: "Annual university technical symposium featuring AI robotics showcases, quantum computing workshops, hackathons, and guest keynotes from tech industry leaders.",
        image_url: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=800&q=80",
        venue: "Dr. APJ Abdul Kalam Auditorium",
        start_datetime: "2026-11-12 09:30:00",
        end_datetime: "2026-11-14 18:00:00",
        registration_deadline: "2026-11-11 23:59:00",
        capacity: 400,
        registered_count: 285,
        available_seats: 115,
        organizer_name: "School of Computing & AI",
        eligibility: "Open to All Enrolled University Students"
      },
      {
        id: 2,
        title: "Campus Music Night & Acoustic Jam",
        category: "Cultural",
        description: "An electrifying evening of indie rock bands, classical fusion performances, and open-mic acoustic sets organized by the University Music Society.",
        image_url: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80",
        venue: "University Amphitheater",
        start_datetime: "2026-11-18 18:00:00",
        end_datetime: "2026-11-18 22:30:00",
        registration_deadline: "2026-11-17 18:00:00",
        capacity: 600,
        registered_count: 540,
        available_seats: 60,
        organizer_name: "University Music Society",
        eligibility: "Valid Student ID Card Required"
      },
      {
        id: 3,
        title: "Innovate Hackathon: AI for Sustainability",
        category: "Competition",
        description: "36-hour non-stop student hackathon building intelligent solutions for climate resilience, urban energy management, and sustainable smart cities.",
        image_url: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=800&q=80",
        venue: "Central Computing Complex Lab 3",
        start_datetime: "2026-11-24 10:00:00",
        end_datetime: "2026-11-25 22:00:00",
        registration_deadline: "2026-11-22 23:59:00",
        capacity: 200,
        registered_count: 188,
        available_seats: 12,
        organizer_name: "Google Developer Student Club",
        eligibility: "Teams of 2-4 Students (UG/PG All Branches)"
      },
      {
        id: 4,
        title: "Hands-on Generative AI & LLM Systems Workshop",
        category: "Workshop",
        description: "Master fine-tuning foundational models, vector embeddings, and LangChain orchestration with hands-on coding notebooks and enterprise mentor guidance.",
        image_url: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=800&q=80",
        venue: "Advanced AI & Data Analytics Lab",
        start_datetime: "2026-11-28 10:00:00",
        end_datetime: "2026-11-28 16:30:00",
        registration_deadline: "2026-11-26 20:00:00",
        capacity: 120,
        registered_count: 98,
        available_seats: 22,
        organizer_name: "Centre for Machine Learning",
        eligibility: "Basic Python Knowledge Recommended"
      },
      {
        id: 5,
        title: "National Leadership & Policy Seminar",
        category: "Seminar",
        description: "Keynote discourse by distinguished diplomatic ambassadors and public administrators analyzing economic resilience, sustainable infrastructure, and global governance in 2027.",
        image_url: "https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=800&q=80",
        venue: "Senate Hall, Administration Tower",
        start_datetime: "2026-12-10 11:00:00",
        end_datetime: "2026-12-10 15:30:00",
        registration_deadline: "2026-12-08 17:00:00",
        capacity: 220,
        registered_count: 175,
        available_seats: 45,
        organizer_name: "Department of Humanities & Public Policy",
        eligibility: "Open to All Undergraduate & Postgraduate Scholars"
      },
      {
        id: 6,
        title: "Annual Inter-College Sports Meet 2026",
        category: "Sports",
        description: "Inter-collegiate athletics championship encompassing track & field, basketball championships, badminton showdowns, and football finals.",
        image_url: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=800&q=80",
        venue: "University Sports Arena & Stadium",
        start_datetime: "2026-12-02 08:00:00",
        end_datetime: "2026-12-05 17:00:00",
        registration_deadline: "2026-11-30 20:00:00",
        capacity: 800,
        registered_count: 610,
        available_seats: 190,
        organizer_name: "University Athletic Association",
        eligibility: "Medical Fitness Certificate Required"
      }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuthSession();
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get('id') || '1';
      loadEventPageDetails(eventId);
    });

    async function loadEventPageDetails(id) {
      const container = document.getElementById('event-detail-content');
      let ev = null;

      try {
        const res = await fetch(`/api/events/${id}`, { credentials: 'include' });
        const data = await res.json();
        if (data.success && data.event) {
          ev = data.event;
        }
      } catch (e) {
        console.warn('Backend event fetch offline, loading local catalog');
      }

      // Fallback if API is offline or returns nothing
      if (!ev) {
        ev = DEFAULT_CAMPUS_EVENTS.find(e => e.id == id) || DEFAULT_CAMPUS_EVENTS[0];
      }

      renderEventDetailsView(ev);
    }

    function renderEventDetailsView(ev) {
      const container = document.getElementById('event-detail-content');
      if (!container || !ev) return;

      const registered = ev.registered_count || 0;
      const capacity = ev.capacity || 100;
      const seatsLeft = ev.available_seats !== undefined ? ev.available_seats : Math.max(0, capacity - registered);
      const percentFull = Math.min(100, Math.round((registered / capacity) * 100));

      const user = window.CampusConnect && window.CampusConnect.currentUser;
      const localRegs = JSON.parse(localStorage.getItem('campusconnect_registrations') || '[]');
      const isReg = ev.user_is_registered || (user && localRegs.some(r => (r.user_id === user.id || r.student_id === user.student_id) && r.event_id == ev.id));

      let actionBtn = '';
      if (isReg) {
        actionBtn = `
          <a href="my-registrations.html" class="btn btn-secondary btn-large">
            <i class="fa-solid fa-ticket text-cyan"></i> View Your Registered Pass
          </a>
        `;
      } else if (ev.is_closed) {
        actionBtn = `<button class="btn btn-secondary btn-large" disabled>Registration Closed</button>`;
      } else if (seatsLeft <= 0) {
        actionBtn = `<button class="btn btn-secondary btn-large" disabled>Event Full</button>`;
      } else {
        actionBtn = `
          <button class="btn btn-primary btn-large btn-glow" onclick="registerForEvent(${ev.id}, '${ev.title.replace(/'/g, "\\'")}')">
            <i class="fa-solid fa-user-plus"></i> Reserve My Free Seat
          </button>
        `;
      }

      container.innerHTML = `
        <div style="background: rgba(18, 24, 46, 0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
          
          <div style="position: relative; height: 380px;">
            <img src="${ev.image_url}" alt="${ev.title}" style="width: 100%; height: 100%; object-fit: cover;">
            <span class="event-category-chip" style="position: absolute; top: 20px; left: 20px; font-size: 0.85rem; padding: 0.4rem 1rem;">
              ${ev.category}
            </span>
          </div>

          <div style="padding: 2.5rem;">
            <h1 style="font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 1rem; line-height: 1.25;">
              ${ev.title}
            </h1>

            <p style="font-size: 1.1rem; color: #cbd5e1; line-height: 1.7; margin-bottom: 2rem;">
              ${ev.description}
            </p>

            <!-- Info Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 2rem;">
              <div>
                <small style="color: #94a3b8; font-weight: 700; text-transform: uppercase;">DATE & TIME</small>
                <div style="color: #fff; font-weight: 600; margin-top: 4px;">
                  <i class="fa-regular fa-calendar-days text-pink"></i> ${new Date(ev.start_datetime).toLocaleString()}
                </div>
              </div>
              <div>
                <small style="color: #94a3b8; font-weight: 700; text-transform: uppercase;">VENUE LOCATION</small>
                <div style="color: #fff; font-weight: 600; margin-top: 4px;">
                  <i class="fa-solid fa-location-dot text-cyan"></i> ${ev.venue}
                </div>
              </div>
              <div>
                <small style="color: #94a3b8; font-weight: 700; text-transform: uppercase;">ELIGIBILITY CRITERIA</small>
                <div style="color: #c084fc; font-weight: 600; margin-top: 4px;">
                  <i class="fa-solid fa-user-check text-purple"></i> ${ev.eligibility || 'Open to All Enrolled Students'}
                </div>
              </div>
              <div>
                <small style="color: #94a3b8; font-weight: 700; text-transform: uppercase;">ORGANIZED BY</small>
                <div style="color: #fff; font-weight: 600; margin-top: 4px;">
                  <i class="fa-solid fa-building-columns text-purple"></i> ${ev.organizer_name || 'University Council'}
                </div>
              </div>
              <div>
                <small style="color: #94a3b8; font-weight: 700; text-transform: uppercase;">REGISTRATION DEADLINE</small>
                <div style="color: #f59e0b; font-weight: 600; margin-top: 4px;">
                  <i class="fa-solid fa-hourglass-half"></i> ${new Date(ev.registration_deadline || ev.start_datetime).toLocaleDateString()}
                </div>
              </div>
            </div>

            <!-- Seat Capacity Tracker -->
            <div style="margin-bottom: 2.5rem;">
              <div style="display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 0.5rem; color: #cbd5e1;">
                <span><strong>${registered}</strong> seats confirmed</span>
                <span><strong>${seatsLeft}</strong> remaining of ${capacity}</span>
              </div>
              <div class="progress-bar-bg" style="height: 10px;">
                <div class="progress-bar-fill" style="width: ${percentFull}%;"></div>
              </div>
            </div>

            <!-- Action Button -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
              <span style="color: #94a3b8; font-size: 0.88rem;">
                <i class="fa-solid fa-shield-halved text-cyan"></i> 100% Free Entry for Enrolled University Students
              </span>
              ${actionBtn}
            </div>

          </div>

        </div>
      `;
    }

    async function registerForEvent(id, title) {
      if (!window.CampusConnect || !window.CampusConnect.isAuthenticated) {
        showToast('Please sign in to register for events.', 'warning');
        setTimeout(() => window.location.href = `login.html?redirect=event-details.html?id=${id}`, 1000);
        return;
      }

      try {
        const res = await fetch('/api/registrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ event_id: id })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(data.message, 'success');
          setTimeout(() => window.location.href = 'my-registrations.html', 1200);
        } else {
          showToast(data.message || 'Registration failed.', 'error');
        }
      } catch (err) {
        console.warn('Backend server offline, saving registration locally');
        const user = window.CampusConnect.currentUser || { full_name: 'Student', student_id: 'CS2026042' };
        const localRegs = JSON.parse(localStorage.getItem('campusconnect_registrations') || '[]');
        
        const isRegistered = localRegs.some(r => (r.user_id === user.id || r.student_id === user.student_id) && r.event_id == id);
        if (isRegistered) {
          showToast('You already have a verified entry pass for this event!', 'warning');
          setTimeout(() => window.location.href = 'my-registrations.html', 1000);
          return;
        }

        const ticketCode = `CC-2026-${String(id).padStart(2, '0')}-${Math.floor(1000 + Math.random() * 9000)}`;
        localRegs.push({
          registration_id: Date.now(),
          event_id: id,
          user_id: user.id || 1,
          student_name: user.full_name,
          student_id: user.student_id,
          title: title,
          category: 'Technology',
          venue: 'Dr. APJ Abdul Kalam Auditorium',
          start_datetime: '2026-11-12 09:30:00',
          ticket_code: ticketCode,
          status: 'confirmed',
          registered_at: new Date().toISOString()
        });

        localStorage.setItem('campusconnect_registrations', JSON.stringify(localRegs));
        showToast(`🎉 Registration confirmed for "${title}"!`, 'success');
        setTimeout(() => window.location.href = 'my-registrations.html', 1000);
      }
    }
  </script>
</body>
</html>
